<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TruthLens AI settings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1324;
        color: #e2e8f0;
        padding: 24px;
        width: 360px;
      }
      h1 {
        font-size: 15px;
        color: #22d3ee;
        margin: 0 0 12px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #94a3b8;
        margin: 12px 0 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: #fff;
        font-size: 13px;
      }
      button {
        margin-top: 16px;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(90deg, #22d3ee, #6366f1);
        color: #0b1324;
        font-weight: 700;
        cursor: pointer;
      }
      p.status {
        margin-top: 10px;
        font-size: 12px;
        color: #6ee7b7;
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <h1>TruthLens AI — connection settings</h1>
    <label for="url">Supabase project URL</label>
    <input id="url" placeholder="https://your-project.supabase.co" />
    <label for="key">Supabase anon key</label>
    <input id="key" placeholder="eyJhbGciOi..." />
    <button id="save">Save</button>
    <p class="status" id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
